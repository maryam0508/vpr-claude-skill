name: vpr-queue

on:
  push:
    branches: [main]
    paths: ["queue/requests.json"]
  workflow_dispatch:          # tombol "Run workflow" manual (untuk sisa antrian)

# Antri satu-satu, jangan batalkan run yang sedang jalan
concurrency:
  group: vpr-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install "pypdf>=5,<6"

      - name: Proses antrian
        run: python scripts/queue_worker.py

      # Opsional: simpan PDF 1 hari agar bisa dicek ulang, tanpa masuk repo
      - name: Simpan PDF sementara (opsional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: tmp_pdfs/
          retention-days: 1
          if-no-files-found: ignore

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "vpr: update ledger dan markdown"
            git pull --rebase origin main
            git push origin main
          fi
