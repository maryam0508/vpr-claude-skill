name: VPR Sandbox Downloader & Validator

on:
  workflow_dispatch:
    inputs:
      paper_urls:
        description: 'Comma or newline-separated PDF URLs or arXiv IDs'
        required: true
        type: string
      expected_title:
        description: 'Expected title for verification (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  validate_and_extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf requests

      - name: Run VPR Sandbox Worker
        env:
          PAPER_URLS: ${{ github.event.inputs.paper_urls }}
          EXPECTED_TITLE: ${{ github.event.inputs.expected_title }}
        run: |
          python vpr/scripts/sandbox_worker.py \
            --urls "$PAPER_URLS" \
            --expected-title "$EXPECTED_TITLE" \
            --output-dir vpr_output

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpr-results
          path: vpr_output/
          retention-days: 7

      - name: Commit results to data branch
        run: |
          git config --global user.name "maryam0508"
          git config --global user.email "351131256+maryam0508@users.noreply.github.com"
          git checkout -B data
          mkdir -p latest
          cp -r vpr_output/* latest/
          git add latest/
          git commit -m "chore(data): update vpr artifacts [skip ci]" || echo "No changes to commit"
          git push origin data --force
